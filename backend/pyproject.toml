[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultra-fast-api"
version = "0.1.0"
description = "Ultra-fast API with FastAPI, PostgreSQL, and Flutter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["fastapi", "postgresql", "flutter", "async"]

dependencies = [
    "fastapi==0.162.2",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    # alembic/env.py は同期の psycopg2 ドライバでマイグレーションする
    "psycopg2-binary==2.9.13",
    "mako==1.4.3",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.33",
    "bcrypt==5.0.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "pytz==2026.6",
    "email-validator==2.3.0",
    "greenlet==3.5.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pygments==2.21.0",
    "aiosqlite==0.22.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "ipython==9.18.1",
    "black==26.10.1",
    "pre-commit>=4.3.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "C901",  # Function is too complex
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
# BaseSettings のフィールドを環境変数から入る値として扱わせる
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -v -m 'not performance'"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration",
    "performance: marks tests as performance tests (requires live database)",
]
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
]

[tool.uv]
# Dependabot の cooldown は直接の依存にしか効かないので、推移的な依存にも公開から 3 日の待機をかける
exclude-newer = "3 days"
